name: Docker

# The build itself lives in chenwei791129/.github so the pinned action versions
# are maintained in exactly one place across repositories. This project already
# published to ghcr.io only, so the image reference is unchanged.
on:
  schedule:
    - cron: '32 18 * * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    permissions:
      contents: read
      packages: write
      # Exchanged for an ephemeral sigstore certificate by cosign's keyless
      # signing; the identity challenge only runs outside pull requests.
      id-token: write
    uses: chenwei791129/.github/.github/workflows/build-and-push-image.yml@main
    with:
      # image-name is omitted: this project publishes under its full
      # owner/repository path, which is the shared workflow's default.
      #
      # The scheduled and short-SHA tags are not part of the shared defaults, so
      # they are requested explicitly; the rest (branch, PR, semver, latest)
      # already match what docker/metadata-action produced here before.
      additional-tags: |
        type=schedule
        type=sha
      # The Dockerfile's builder stage is not cross-compiled, so this stays a
      # single-architecture build as before rather than taking the shared
      # linux/amd64,linux/arm64 default.
      platforms: linux/amd64
      sign-image: true
      # Pinned to the version this project signed with before the migration.
      # Bumping to the shared default (v3) is a separate decision.
      cosign-version: v2.2.4
